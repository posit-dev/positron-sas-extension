# This workflow perform basic checks for a pull request

name: Pull Request Check

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Non-blocking: reformatting files shared with the upstream
      # sassoftware/vscode-sas-extension fork would cause merge conflicts.
      # Issues are still reported in the log.
      - run: npm run format:check
        continue-on-error: true
      - run: npm run copyright:check
      - run: npm run compile
      # Unit tests run transpile-only: the test tsconfigs lack mocha/node
      # types, and Node 22+ needs --no-experimental-strip-types for ts-node.
      - run: npm run test-server
        env:
          TS_NODE_TRANSPILE_ONLY: "true"
          NODE_OPTIONS: --no-experimental-strip-types
      - run: npm run test-positron
        env:
          TS_NODE_TRANSPILE_ONLY: "true"
      - run: npm run test-server-bundle
      # Non-blocking: the client has pre-existing strict-mode type errors,
      # mostly in files shared with upstream. tsc still emits client/out,
      # which the VS Code integration tests run from.
      - run: npx tsc -p ./client
        continue-on-error: true
      - run: xvfb-run -a npm run test-client
        if: runner.os == 'Linux'
      - run: npx @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          path: ./*.vsix
          retention-days: 5
