name: Translation Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-translations:
    # Upstream's signal for its localization team. The fork has no translators
    # and shares the locale files with upstream, so the check only runs there,
    # or when started by hand (Actions > Translation Check > Run workflow).
    if: github.repository == 'sassoftware/vscode-sas-extension' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run locale --update-locales
      - run: |
          CHANGES=$(git diff --name-only -- "*.nls.*" "l10n/*")
          if [ -z "$CHANGES" ]
          then
            echo "No translations needed"
          else
            echo "The following files need translations:"
            echo $CHANGES
            exit 1
          fi
