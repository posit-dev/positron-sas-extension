# Runs the Positron API integration tests (client/test/positron-api/) inside
# a real downloaded Positron build. See client/test/positron-api/README.md.

name: Positron API Tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  POSITRON_CHANNEL: stable

jobs:
  test:
    # Linux Actions minutes bill at ~1/10 the macOS rate. Positron is an
    # Electron app, so the test command runs under xvfb for a display server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash
      # Cache the downloaded Positron build, keyed by day so a fresh build is
      # picked up at most once a day. runner.os is in the key because the
      # cache layout is .positron-test/<channel>/<version>/<platform> — an
      # OS-less key could restore another platform's build and suppress the
      # save step for this one.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: ./.positron-test
          key: positron-${{ runner.os }}-${{ env.POSITRON_CHANNEL }}-${{ steps.get-date.outputs.date }}
      - run: npm ci --no-audit --no-fund
      - name: Run Positron API tests
        uses: posit-dev/setup-positron@v1
        with:
          positron-channel: ${{ env.POSITRON_CHANNEL }}
          run: xvfb-run -a npm run test-positron-api
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ./.positron-test
          key: positron-${{ runner.os }}-${{ env.POSITRON_CHANNEL }}-${{ steps.get-date.outputs.date }}
