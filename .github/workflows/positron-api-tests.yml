# Runs the Positron API integration tests (client/test/positron-api/) inside
# a real downloaded Positron build. See client/test/positron-api/README.md.

name: Positron API Tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  POSITRON_CHANNEL: stable

jobs:
  test:
    # Stable Positron builds are currently only extractable on macOS, and
    # posit-dev/setup-positron supports macOS runners only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash
      # Cache the downloaded Positron build, keyed by day so a fresh build is
      # picked up at most once a day.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: ./.positron-test
          key: positron-${{ env.POSITRON_CHANNEL }}-${{ steps.get-date.outputs.date }}
      - run: npm ci --no-audit --no-fund
      - name: Run Positron API tests
        uses: posit-dev/setup-positron@main
        with:
          positron-channel: ${{ env.POSITRON_CHANNEL }}
          run: npm run test-positron-api
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ./.positron-test
          key: positron-${{ env.POSITRON_CHANNEL }}-${{ steps.get-date.outputs.date }}
