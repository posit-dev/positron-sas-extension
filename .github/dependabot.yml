# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

# All version updates (every directory and ecosystem) are collated into a
# single monthly pull request.
multi-ecosystem-groups:
  monthly:
    schedule:
      interval: "monthly"

updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
    ignore:
      # eslint-plugin-react 7.x only supports eslint up to 9 (peer dependency)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/client"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
    ignore:
      # @types/vscode should match the engine version we're using
      # should not be upgraded on its own
      - dependency-name: "@types/vscode"
  - package-ecosystem: "npm"
    directory: "/server"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
  - package-ecosystem: "npm"
    directory: "/website"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
  - package-ecosystem: "github-actions"
    # Don't need to specify `/.github/workflows` for `directory`. Github knows it.
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
