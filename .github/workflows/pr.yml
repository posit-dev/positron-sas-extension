# This workflow perform basic checks for a pull request

name: Pull Request Check

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Non-blocking: reformatting files shared with the upstream
      # sassoftware/vscode-sas-extension fork would cause merge conflicts.
      # Issues are still reported in the log.
      - run: npm run format:check
        continue-on-error: true
      - run: npm run copyright:check
      - run: xvfb-run -a npm run test
        if: runner.os == 'Linux'
      - run: npm run test-server-bundle
      - run: npx @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          path: ./*.vsix
          retention-days: 5
